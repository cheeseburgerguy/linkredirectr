<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>checking link...</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060913] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500/30">

  <main class="w-full max-w-md bg-[#0f172a] border border-slate-800/80 rounded-2xl p-8 text-center shadow-2xl">
    <div class="w-14 h-14 rounded-full bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center mx-auto mb-5">
      <svg class="w-6 h-6 text-indigo-400 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path>
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-white tracking-tight mb-2">
      checking link...
    </h1>
    <p id="status-text" class="text-sm text-slate-400 leading-relaxed mb-5">
      verifying shortlink and destination availability.
    </p>

    <div class="inline-block max-w-full truncate px-3.5 py-1.5 rounded-full bg-[#060913] border border-slate-800 text-xs font-mono text-slate-400">
      <span id="path-label">/</span>
    </div>
  </main>

  <script>
    (function () {
      const isPreview = window.location.protocol === "blob:" || window.location.protocol === "file:";

      function buildUrl(fileOrPath, paramsObj) {
        const query = paramsObj ? new URLSearchParams(paramsObj).toString() : "";
        const suffix = query ? "?" + query : "";
        if (isPreview) return fileOrPath.replace(/^\//, "") + suffix;
        return window.location.origin + fileOrPath + suffix;
      }

      function safeNavigate(url) {
        if (isPreview) {
          document.getElementById("status-text").textContent = "preview redirect: " + url;
          return;
        }
        window.location.replace(url);
      }

      function redirectTo404(reason, path, target) {
        const params = { reason, path };
        if (target) params.target = target;
        safeNavigate(buildUrl("/404.html", params));
      }

      function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const fetchPromise = fetch(url, { ...options, signal: controller.signal });
        const timeoutPromise = new Promise((_, reject) => {
          setTimeout(() => {
            controller.abort();
            reject(new Error("timeout"));
          }, timeoutMs);
        });
        return Promise.race([fetchPromise, timeoutPromise]);
      }

      async function pingDestination(targetUrl) {
        // Browsers block http:// subresource fetches on https:// pages as Mixed Content
        if (window.location.protocol === "https:" && targetUrl.startsWith("http://")) {
          return true;
        }

        // Fast 2-step check (~4s max total)
        const timeouts = [2500, 1500];
        for (const ms of timeouts) {
          try {
            await fetchWithTimeout(
              targetUrl,
              { method: "GET", mode: "no-cors", cache: "default", redirect: "follow" },
              ms
            );
            return true;
          } catch (_) {
            // retry once on brief network/DNS hiccup
          }
        }
        return false;
      }

      async function run() {
        const params = new URLSearchParams(window.location.search);
        let shortPath = params.get("path") || window.location.pathname;
        shortPath = "/" + shortPath.replace(/^\/+|\/+$/g, "");
        if (shortPath === "/loading.html" || shortPath === "/loading") shortPath = "/";

        document.getElementById("path-label").textContent = shortPath;

        if (shortPath === "/") {
          safeNavigate(buildUrl("/"));
          return;
        }

        let redirectsMap = null;
        try {
          const res = await fetchWithTimeout("/redirects.json", { cache: "no-cache" }, 4000);
          if (!res.ok) {
            redirectTo404("json_missing", shortPath);
            return;
          }
          const rawText = await res.text();
          redirectsMap = JSON.parse(rawText);
        } catch (err) {
          redirectTo404("json_invalid", shortPath, err && err.message ? err.message.slice(0, 80) : "parse error");
          return;
        }

        const lookupKey = shortPath.toLowerCase();
        let targetUrl = redirectsMap[shortPath] || redirectsMap[lookupKey];

        if (!targetUrl) {
          for (const [key, val] of Object.entries(redirectsMap)) {
            const normKey = "/" + String(key).replace(/^\/+|\/+$/g, "").toLowerCase();
            if (normKey === lookupKey && typeof val === "string") {
              targetUrl = val;
              break;
            }
          }
        }

        if (!targetUrl) {
          redirectTo404("not_found", shortPath);
          return;
        }

        const isReachable = await pingDestination(targetUrl);
        if (isReachable) {
          document.getElementById("status-text").textContent = "redirecting...";
          safeNavigate(targetUrl);
        } else {
          redirectTo404("broken", shortPath, targetUrl);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
