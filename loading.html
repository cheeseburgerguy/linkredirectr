<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checking link...</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/prFxqGVk/Screenshot-2026-11-09-5-09-28-PM.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Loading Card Container -->
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full">
        <!-- Spinning Loader Icon -->
        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-400">
            <svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>

        <h1 id="loading-title" class="text-2xl font-bold text-white mb-2">checking link...</h1>
        <p id="loading-desc" class="text-slate-400 text-sm mb-6">verifying the destination page status.</p>

        <div id="path-badge" class="inline-block bg-slate-800 text-indigo-300 text-xs font-mono px-3 py-1 rounded-full max-w-full truncate"></div>
    </div>

    <script>
        /**
         * Wraps fetch() with both an AbortController AND a hard Promise.race timer.
         * Guarantees requests never hang if an extension or web filter stalls fetch().
         */
        function fetchWithHardTimeout(url, options, timeoutMs) {
            const controller = new AbortController();
            const fetchPromise = fetch(url, {
                ...options,
                signal: controller.signal
            });

            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => {
                    try {
                        controller.abort();
                    } catch (e) {
                        // Ignore abort errors
                    }
                    reject(new Error("request timed out"));
                }, timeoutMs);
            });

            return Promise.race([fetchPromise, timeoutPromise]);
        }

        /**
         * Normalizes a pathname so "/Aeos1/" and "/aeos1" match cleanly.
         */
        function normalizePath(rawPath) {
            if (!rawPath) return "/";
            let clean = rawPath.split("?")[0].split("#")[0].trim().toLowerCase();
            if (!clean.startsWith("/")) clean = "/" + clean;
            if (clean.length > 1 && clean.endsWith("/")) {
                clean = clean.slice(0, -1);
            }
            return clean;
        }

        /**
         * Cleans accidental Markdown link formatting or stray backslashes in a URL.
         */
        function sanitizeTargetUrl(rawUrl) {
            let url = rawUrl.trim();
            const mdMatch = url.match(/^\[[^\]]+\]\((https?:\/\/[^)]+)\)$/i);
            if (mdMatch) {
                url = mdMatch[1];
            }
            return url.replace(/\\([:&!_])/g, "$1").trim();
        }

        /**
         * Recursively flattens a parsed JSON object or array of objects into
         * a single normalized { "/path": "https://..." } lookup table.
         */
        function flattenRedirectsData(node, outMap) {
            if (!node || typeof node !== "object") return;

            if (Array.isArray(node)) {
                for (const item of node) {
                    flattenRedirectsData(item, outMap);
                }
                return;
            }

            for (const [key, value] of Object.entries(node)) {
                if (typeof value === "string") {
                    outMap[normalizePath(key)] = sanitizeTargetUrl(value);
                } else if (value && typeof value === "object") {
                    flattenRedirectsData(value, outMap);
                }
            }
        }

        /**
         * Resolves a clean path against flattened entries in redirects.json.
         */
        function resolveTargetUrl(redirectsMap, cleanPath) {
            return redirectsMap[cleanPath] || null;
        }

        /**
         * Tests whether a destination URL is reachable using two bounded attempts.
         * Uses mode: 'no-cors' so cross-origin websites without CORS headers still
         * resolve as valid opaque responses when their server is online.
         */
        async function isDestinationReachable(targetUrl, descEl) {
            const attempts = [4500, 4500];

            for (let i = 0; i < attempts.length; i++) {
                if (i > 0 && descEl) {
                    descEl.textContent = "connection slow, retrying destination...";
                }

                try {
                    await fetchWithHardTimeout(
                        targetUrl,
                        {
                            method: "GET",
                            mode: "no-cors",
                            cache: "default",
                            redirect: "follow"
                        },
                        attempts[i]
                    );
                    return true;
                } catch (err) {
                    // Failed or timed out on this attempt; loop will retry once
                }
            }

            return false;
        }

        /**
         * Forwards the user to 404.html with clear error metadata in query params.
         */
        function redirectTo404(reason, path, targetUrl) {
            const titleEl = document.getElementById("loading-title");
            const descEl = document.getElementById("loading-desc");

            if (window.location.protocol === "blob:" || window.location.protocol === "file:") {
                if (titleEl) {
                    if (reason === "broken") titleEl.textContent = "destination link broken";
                    else if (reason === "json_missing") titleEl.textContent = "redirects.json not found";
                    else if (reason === "json_invalid") titleEl.textContent = "invalid redirects.json format";
                    else titleEl.textContent = "error 404 - path not found";
                }
                if (descEl) {
                    if (reason === "broken") descEl.textContent = "the target website for this shortlink is invalid or unreachable.";
                    else if (reason === "json_missing") descEl.textContent = "make sure redirects.json is uploaded in the root folder of your site.";
                    else if (reason === "json_invalid") descEl.textContent = targetUrl || "redirects.json has a syntax error and could not be read.";
                    else descEl.textContent = "this shortlink path does not exist in redirects.json.";
                }
                return;
            }

            const params = new URLSearchParams();
            params.set("reason", reason);
            if (path) params.set("path", path);
            if (targetUrl) params.set("target", targetUrl);

            const errorUrl = new URL("/404.html?" + params.toString(), window.location.origin).href;
            window.location.replace(errorUrl);
        }

        /**
         * Main link-checking workflow executed when loading.html opens.
         */
        async function runLinkCheck() {
            const descEl = document.getElementById("loading-desc");
            const badgeEl = document.getElementById("path-badge");
            const params = new URLSearchParams(window.location.search);
            const isPreviewBlob = window.location.protocol === "blob:" || window.location.protocol === "file:";

            const rawRequestedPath = params.get("path") || (isPreviewBlob ? "/preview" : window.location.pathname);
            const cleanPath = normalizePath(rawRequestedPath);

            badgeEl.textContent = cleanPath;

            if (cleanPath === "/" || cleanPath === "/loading" || cleanPath === "/loading.html") {
                if (!isPreviewBlob) {
                    window.location.replace(new URL("/", window.location.origin).href);
                }
                return;
            }

            try {
                const jsonRes = await fetchWithHardTimeout(
                    "/redirects.json?t=" + Date.now(),
                    { cache: "no-store" },
                    5000
                );

                if (!jsonRes.ok) {
                    redirectTo404("json_missing", cleanPath, "HTTP " + jsonRes.status);
                    return;
                }

                const rawText = await jsonRes.text();
                const trimmedText = rawText ? rawText.trim() : "";

                if (!trimmedText || trimmedText.startsWith("<")) {
                    redirectTo404("json_missing", cleanPath, "redirects.json not found at site root");
                    return;
                }

                let flatRedirectsMap = {};
                try {
                    // Auto-repair adjacent JSON objects if chunks were pasted together,
                    // and strip any trailing commas before closing brackets/braces.
                    const cleanedJsonText = trimmedText
                        .replace(/\}\s*\{/g, ",")
                        .replace(/,\s*([}\]])/g, "$1");
                    const parsedJson = JSON.parse(cleanedJsonText);
                    flattenRedirectsData(parsedJson, flatRedirectsMap);
                } catch (parseErr) {
                    console.error("invalid redirects.json format:", parseErr);
                    redirectTo404("json_invalid", cleanPath, parseErr.message);
                    return;
                }

                const targetUrl = resolveTargetUrl(flatRedirectsMap, cleanPath);

                if (!targetUrl) {
                    redirectTo404("not_found", cleanPath, "");
                    return;
                }

                badgeEl.textContent = cleanPath + " → " + targetUrl;

                const isReachable = await isDestinationReachable(targetUrl, descEl);

                if (isReachable) {
                    descEl.textContent = "link verified! redirecting now...";
                    window.location.replace(targetUrl);
                } else {
                    redirectTo404("broken", cleanPath, targetUrl);
                }
            } catch (err) {
                console.error("link check error:", err);
                redirectTo404("not_found", cleanPath, "");
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", runLinkCheck);
        } else {
            runLinkCheck();
        }
    </script>
</body>
</html>
