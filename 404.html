<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>error 404 - invalid link</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/prFxqGVk/Screenshot-2026-11-09-5-09-28-PM.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Error Card Container -->
    <div id="status-card" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full">
        <!-- Warning Icon -->
        <div id="icon-container" class="w-16 h-16 bg-rose-500/10 border border-rose-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-rose-400">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 id="status-title" class="text-2xl font-bold text-white mb-2">error 404</h1>
        <p id="status-desc" class="text-slate-400 text-sm mb-6">this link or path is invalid.</p>

        <div id="path-badge" class="inline-block bg-slate-800 text-rose-300 text-xs font-mono px-3 py-1 rounded-full mb-6 max-w-full truncate"></div>

        <!-- Live Email Sending Status Display -->
        <div id="email-status" class="hidden text-xs font-mono mb-6"></div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-3">
            <!-- Shown only when a known shortlink's destination is broken -->
            <div id="broken-actions" class="hidden">
                <div class="flex flex-wrap items-center justify-center gap-2.5">
                    <button id="retry-btn" type="button" class="inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-colors duration-200 cursor-pointer">
                        try again
                    </button>
                    <button id="report-btn" type="button" class="inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-rose-600/90 hover:bg-rose-500 text-white font-medium text-sm transition-colors duration-200 cursor-pointer">
                        send report
                    </button>
                </div>
            </div>

            <a href="/" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-sm transition-colors duration-200">
                return to home
            </a>

            <a id="force-open-link" href="#" class="hidden text-xs text-slate-500 hover:text-slate-300 underline mt-1">
                open destination anyway
            </a>
        </div>
    </div>

    <script>
        let currentCleanPath = "";
        let currentTargetUrl = "";
        let reportAlreadySent = false;

        /**
         * Sends a broken-link report email via FormSubmit and displays live status.
         */
        async function sendEmailAlert(attemptedPath, targetUrl) {
            const emailStatusEl = document.getElementById("email-status");
            const reportBtn = document.getElementById("report-btn");

            emailStatusEl.classList.remove("hidden");
            emailStatusEl.className = "text-xs font-mono mb-6 text-indigo-300 animate-pulse";
            emailStatusEl.textContent = "sending email alert...";

            if (reportBtn) {
                reportBtn.disabled = true;
                reportBtn.classList.add("opacity-50", "cursor-not-allowed");
            }

            try {
                const response = await fetch("https://formsubmit.co/ajax/vince_yang702@ahschools.us", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        name: "link redirect monitor",
                        subject: "broken destination link reported: " + attemptedPath,
                        message: "a visitor reported that the destination URL for " + attemptedPath + " is invalid or unreachable.",
                        attempted_path: attemptedPath,
                        invalid_destination_url: targetUrl,
                        timestamp: new Date().toLocaleString(),
                        _captcha: "false",
                        _template: "table"
                    })
                });

                const rawResponse = await response.text();
                let parsed = {};
                try {
                    parsed = JSON.parse(rawResponse);
                } catch (e) {
                    // Non-JSON response fallback
                }

                if (response.ok && (parsed.success === "true" || parsed.success === true || response.status === 200)) {
                    reportAlreadySent = true;
                    emailStatusEl.className = "text-xs font-mono mb-6 text-emerald-400";
                    emailStatusEl.textContent = "✓ email alert sent successfully!";
                    if (reportBtn) {
                        reportBtn.textContent = "report sent";
                    }
                } else {
                    throw new Error(parsed.message || "submission rejected");
                }
            } catch (err) {
                console.error("failed to send report email:", err);
                emailStatusEl.className = "text-xs font-mono mb-6 text-rose-400";
                emailStatusEl.textContent = "✗ failed to send email alert";
                if (reportBtn) {
                    reportBtn.disabled = false;
                    reportBtn.classList.remove("opacity-50", "cursor-not-allowed");
                }
            }
        }

        /**
         * Initializes the 404 error view.
         * If a visitor landed here directly on a shortlink path without passing through
         * loading.html first, automatically hand off to loading.html to check the link.
         */
        function initErrorPage() {
            const params = new URLSearchParams(window.location.search);
            const reason = params.get("reason");
            const normalizedPathname = window.location.pathname.replace(/\/+$/, "") || "/";
            const isPreviewBlob = window.location.protocol === "blob:" || window.location.protocol === "file:";
            const isDirect404File = normalizedPathname === "/404.html" || normalizedPathname === "/404";

            // If Cloudflare served 404.html directly for a shortlink path (e.g. /aeos1) on HTTP/HTTPS,
            // forward to loading.html so loading & link verification happen there first.
            if (!reason && !isDirect404File && !isPreviewBlob) {
                try {
                    const requested = window.location.pathname + window.location.search;
                    const loadingUrl = new URL("/loading.html?path=" + encodeURIComponent(requested), window.location.origin).href;
                    window.location.replace(loadingUrl);
                    return;
                } catch (navErr) {
                    console.warn("unable to redirect to loading.html, rendering 404 view directly:", navErr);
                }
            }

            const titleEl = document.getElementById("status-title");
            const descEl = document.getElementById("status-desc");
            const badgeEl = document.getElementById("path-badge");
            const brokenActionsEl = document.getElementById("broken-actions");
            const forceOpenEl = document.getElementById("force-open-link");
            const retryBtn = document.getElementById("retry-btn");
            const reportBtn = document.getElementById("report-btn");

            currentCleanPath = params.get("path") || (isPreviewBlob ? "/preview" : window.location.pathname) || "/unknown";
            currentTargetUrl = params.get("target") || "";

            if (reason === "broken" && currentTargetUrl) {
                // Destination link exists in redirects.json, but target website is invalid/down
                titleEl.textContent = "destination link broken";
                descEl.textContent = "the target website for this shortlink is invalid or unreachable.";
                badgeEl.textContent = currentCleanPath + " → " + currentTargetUrl;

                brokenActionsEl.classList.remove("hidden");
                forceOpenEl.href = currentTargetUrl;
                forceOpenEl.classList.remove("hidden");

                retryBtn.addEventListener("click", () => {
                    if (isPreviewBlob) {
                        window.location.reload();
                        return;
                    }
                    const retryUrl = new URL("/loading.html?path=" + encodeURIComponent(currentCleanPath), window.location.origin).href;
                    window.location.href = retryUrl;
                });

                reportBtn.addEventListener("click", () => {
                    if (!reportAlreadySent) {
                        sendEmailAlert(currentCleanPath, currentTargetUrl);
                    }
                });
            } else if (reason === "json_missing") {
                // redirects.json was not found at the site root
                titleEl.textContent = "redirects.json not found";
                descEl.textContent = "make sure redirects.json is placed in the root folder of your deployment.";
                badgeEl.textContent = currentCleanPath + (currentTargetUrl ? " (" + currentTargetUrl + ")" : "");
            } else if (reason === "json_invalid") {
                // redirects.json exists, but contains a JSON syntax error
                titleEl.textContent = "invalid redirects.json format";
                descEl.textContent = "redirects.json has a syntax error and could not be parsed.";
                badgeEl.textContent = currentTargetUrl || currentCleanPath;
            } else {
                // Path does not exist in redirects.json
                titleEl.textContent = "error 404 - path not found";
                descEl.textContent = "this shortlink path does not exist or has been removed.";
                badgeEl.textContent = currentCleanPath;
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initErrorPage);
        } else {
            initErrorPage();
        }
    </script>
</body>
</html>
