<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>link error</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060913] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500/30">

  <main id="error-card" class="hidden w-full max-w-md bg-[#0f172a] border border-slate-800/80 rounded-2xl p-8 text-center shadow-2xl">
    <!-- warning icon -->
    <div class="w-14 h-14 rounded-full bg-rose-500/10 border border-rose-500/20 flex items-center justify-center mx-auto mb-5">
      <svg class="w-6 h-6 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </div>

    <!-- heading & description -->
    <h1 id="error-title" class="text-2xl font-bold text-white tracking-tight mb-2">
      destination link broken
    </h1>
    <p id="error-subtitle" class="text-sm text-slate-400 leading-relaxed mb-5">
      the target website for this shortlink is invalid or unreachable.
    </p>

    <!-- path / target badge -->
    <div class="mb-6">
      <div id="path-badge" class="inline-block max-w-full truncate px-3.5 py-1.5 rounded-full bg-[#060913] border border-slate-800 text-xs font-mono text-slate-400">
        /unknown
      </div>
    </div>

    <!-- report status (shown only after user clicks send report) -->
    <p id="email-status" class="hidden text-xs font-mono text-slate-400 mb-5"></p>

    <!-- broken-link actions -->
    <div id="broken-actions" class="hidden items-center justify-center gap-3 mb-3">
      <button id="retry-btn" type="button" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white text-sm font-medium transition cursor-pointer">
        try again
      </button>
      <button id="report-btn" type="button" class="px-5 py-2.5 rounded-xl bg-rose-950/80 hover:bg-rose-900/80 border border-rose-800/50 text-rose-200 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
        send report
      </button>
    </div>

    <!-- return home -->
    <a id="home-btn" href="/" class="block w-full py-3 rounded-xl bg-slate-800/90 hover:bg-slate-800 text-white text-sm font-medium transition mb-4">
      return to home
    </a>

    <!-- bypass link -->
    <div id="bypass-wrapper" class="hidden">
      <a id="bypass-link" href="#" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-slate-200 underline underline-offset-4 transition">
        open destination anyway
      </a>
    </div>
  </main>

  <script>
    (function () {
      const ALERT_EMAIL = "vince_yang702@ahschools.us";
      const isPreview = window.location.protocol === "blob:" || window.location.protocol === "file:";
      const memoryReported = new Set();

      function buildUrl(fileOrPath, paramsObj) {
        const query = paramsObj ? new URLSearchParams(paramsObj).toString() : "";
        const suffix = query ? "?" + query : "";
        if (isPreview) return fileOrPath.replace(/^\//, "") + suffix;
        return window.location.origin + fileOrPath + suffix;
      }

      function safeNavigate(url) {
        if (isPreview) {
          console.log("Preview navigation:", url);
          return;
        }
        window.location.replace(url);
      }

      function hasAlreadyReported(key) {
        if (memoryReported.has(key)) return true;
        try {
          if (localStorage.getItem(key) === "1") return true;
        } catch (_) {}
        try {
          if (sessionStorage.getItem(key) === "1") return true;
        } catch (_) {}
        return false;
      }

      function markReported(key) {
        memoryReported.add(key);
        try {
          localStorage.setItem(key, "1");
        } catch (_) {}
        try {
          sessionStorage.setItem(key, "1");
        } catch (_) {}
      }

      const rawPath = window.location.pathname.replace(/\/+$/, "") || "/";
      const searchParams = new URLSearchParams(window.location.search);

      // If hit directly as a shortlink (not /404), hand off to loading.html first
      if (rawPath !== "/404" && rawPath !== "/404.html" && !isPreview) {
        safeNavigate(buildUrl("/loading.html", { path: rawPath }));
        return;
      }

      const reason = searchParams.get("reason") || "not_found";
      const shortPath = searchParams.get("path") || "/unknown";
      const targetUrl = searchParams.get("target") || "";

      const card = document.getElementById("error-card");
      const titleEl = document.getElementById("error-title");
      const subtitleEl = document.getElementById("error-subtitle");
      const badgeEl = document.getElementById("path-badge");
      const emailStatusEl = document.getElementById("email-status");
      const brokenActionsEl = document.getElementById("broken-actions");
      const retryBtn = document.getElementById("retry-btn");
      const reportBtn = document.getElementById("report-btn");
      const homeBtn = document.getElementById("home-btn");
      const bypassWrapper = document.getElementById("bypass-wrapper");
      const bypassLink = document.getElementById("bypass-link");

      homeBtn.href = buildUrl("/");
      card.classList.remove("hidden");

      const reportKey = "reported_link_" + shortPath.toLowerCase();
      let isSending = false;

      function lockReportButton(label) {
        reportBtn.disabled = true;
        reportBtn.textContent = label || "reported";
      }

      async function sendManualReport() {
        if (isSending || hasAlreadyReported(reportKey)) {
          lockReportButton("reported");
          return;
        }

        isSending = true;
        lockReportButton("sending...");
        emailStatusEl.classList.remove("hidden");
        emailStatusEl.textContent = "sending report...";
        emailStatusEl.className = "text-xs font-mono text-slate-400 mb-5";

        const payload = {
          _subject: "[broken link report] " + shortPath,
          _template: "table",
          _captcha: "false",
          path: shortPath,
          target: targetUrl || "n/a",
          checked_from: window.location.origin,
          time: new Date().toISOString()
        };

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 4000);

        try {
          const res = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(ALERT_EMAIL), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify(payload),
            keepalive: true,
            signal: controller.signal
          });
          clearTimeout(timer);

          if (!res.ok) throw new Error("http " + res.status);

          markReported(reportKey);
          lockReportButton("reported");
          emailStatusEl.textContent = "report sent";
          emailStatusEl.className = "text-xs font-mono text-emerald-400 mb-5";
        } catch (_) {
          clearTimeout(timer);
          try {
            const formData = new FormData();
            Object.entries(payload).forEach(([k, v]) => formData.append(k, v));
            await fetch("https://formsubmit.co/" + encodeURIComponent(ALERT_EMAIL), {
              method: "POST",
              mode: "no-cors",
              body: formData,
              keepalive: true
            });
            markReported(reportKey);
            lockReportButton("reported");
            emailStatusEl.textContent = "report sent";
            emailStatusEl.className = "text-xs font-mono text-emerald-400 mb-5";
          } catch (__) {
            isSending = false;
            reportBtn.disabled = false;
            reportBtn.textContent = "send report";
            emailStatusEl.textContent = "could not send report";
            emailStatusEl.className = "text-xs font-mono text-rose-400 mb-5";
          }
        }
      }

      if (reason === "broken" && targetUrl) {
        titleEl.textContent = "destination link broken";
        subtitleEl.textContent = "the target website for this shortlink is invalid or unreachable.";
        badgeEl.textContent = shortPath + " -> " + targetUrl;

        brokenActionsEl.classList.remove("hidden");
        brokenActionsEl.classList.add("flex");
        bypassWrapper.classList.remove("hidden");
        bypassLink.href = targetUrl;

        if (hasAlreadyReported(reportKey)) {
          lockReportButton("reported");
          emailStatusEl.classList.remove("hidden");
          emailStatusEl.textContent = "you already reported this link";
          emailStatusEl.className = "text-xs font-mono text-emerald-400 mb-5";
        }

        retryBtn.addEventListener("click", () => {
          safeNavigate(buildUrl("/loading.html", { path: shortPath }));
        });

        reportBtn.addEventListener("click", sendManualReport);
      } else if (reason === "json_invalid" || reason === "json_missing") {
        titleEl.textContent = reason === "json_missing" ? "redirects.json not found" : "invalid redirects.json format";
        subtitleEl.textContent = reason === "json_missing"
          ? "could not load redirects.json from the site root."
          : "redirects.json has a syntax error and could not be parsed.";
        badgeEl.textContent = targetUrl || shortPath;
      } else {
        titleEl.textContent = "error 404 - path not found";
        subtitleEl.textContent = "this shortlink path does not exist or has been removed.";
        badgeEl.textContent = shortPath;
      }
    })();
  </script>
</body>
</html>
